<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ead8b7" />
  <meta name="description" content="Ajay & Deepthi Engagement Invitation" />
  <title>Ajay & Deepthi | Engagement Invitation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="backgroundMusic" loop preload="auto" aria-label="Background music">
    <source src="background-song.mp3" type="audio/mpeg" />
  </audio>

  <main>
    <!-- Original cover image is used exactly as supplied. The button is an HTML overlay only. -->
    <section class="opening" id="opening" aria-label="Open invitation">
      <div class="cover-frame">
        <img class="cover-image" src="assets/01-cover.jpeg" alt="Ajay and Deepthi engagement invitation cover" />

        <!-- Button is placed on the RIGHT side so it does not cover the couple. -->
        <button id="openInvitation" class="open-btn" type="button">
          <span>Open Invitation</span>
          <span class="heart">♡</span>
        </button>
        <div class="tap-hint">Tap to begin</div>
      </div>
    </section>

    <section class="invitation" id="invitation" aria-label="Invitation pages">
      <div class="pages">
        <figure class="page"><img src="assets/02-engagement.jpeg" alt="Engagement invitation" loading="eager"></figure>
        <figure class="page"><img src="assets/03-couple.jpeg" alt="Ajay and Deepthi" loading="lazy"></figure>
        <figure class="page"><img src="assets/04-families.jpeg" alt="Families invitation page" loading="lazy"></figure>
        <figure class="page"><img src="assets/05-details.jpeg" alt="Engagement details" loading="lazy"></figure>
        <figure class="page"><img src="assets/06-blessings.jpeg" alt="Blessings invitation page" loading="lazy"></figure>
      </div>
    </section>
  </main>

  <div class="controls" id="controls" aria-hidden="true">
    <button id="pauseScroll" type="button" aria-label="Start automatic scrolling" title="Start auto scroll">▶</button>
    <button id="topButton" type="button" aria-label="Return to top">↑</button>
    <button id="musicButton" type="button" aria-label="Pause background music">♫</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
