<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ead8b7" />
  <meta name="description" content="Ajay & Deepthi Engagement Invitation" />
  <title>Ajay & Deepthi | Engagement Invitation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <!-- IMAGE 1 is shown exactly as supplied.
         Only the Open Invitation button is added below the names. -->
    <section class="opening" id="opening" aria-label="Open invitation">
      <button id="openInvitation" class="open-btn" type="button">
        <span>Open Invitation</span>
        <span class="arrow">↓</span>
      </button>
    </section>

    <!-- Remaining invitation pages -->
    <section class="invitation" id="invitation" aria-label="Invitation pages">
      <div class="pages">
        <figure class="page">
          <img src="assets/02-engagement.jpeg" alt="Engagement invitation" loading="eager">
        </figure>
        <figure class="page">
          <img src="assets/03-couple.jpeg" alt="Ajay and Deepthi" loading="lazy">
        </figure>
        <figure class="page">
          <img src="assets/04-families.jpeg" alt="Families invitation page" loading="lazy">
        </figure>
        <figure class="page">
          <img src="assets/05-details.jpeg" alt="Engagement details" loading="lazy">
        </figure>
        <figure class="page">
          <img src="assets/06-blessings.jpeg" alt="Blessings invitation page" loading="lazy">
        </figure>
      </div>
    </section>
  </main>

  <div class="controls" id="controls" aria-hidden="true">
    <button id="pauseScroll" type="button" aria-label="Pause automatic scrolling">Ⅱ</button>
    <button id="topButton" type="button" aria-label="Return to top">↑</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
